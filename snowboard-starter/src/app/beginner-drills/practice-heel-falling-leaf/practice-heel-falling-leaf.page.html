<app-header
  title="Heel Falling Leaf Drill"
  [isHomePage]=false>
</app-header>

<ion-content [fullscreen]="true">
  <div class="beginner-instructions">
    <form [formGroup]="drillForm">
      <div>
        <p>How many reps do you want?</p>
        <ion-input
          placeholder="Enter reps"
          formControlName="reps"></ion-input>
      </div>
    </form>
    @if (reps) {
      @for (item of lessonInstructions; track item) {
        <app-instruction-text
          [disabled]="isButtonDisabled(item)"
          (instructionClick)="addInstructionText()"
          [instructionText]="item">
        </app-instruction-text>
      }
    }
  </div>
</ion-content>
