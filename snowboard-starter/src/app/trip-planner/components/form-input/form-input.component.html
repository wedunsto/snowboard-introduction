<div class="form-input-item">
  <p>{{ title() }}</p>
  @if (type() === 'destination' || type() === 'budget') {
    <ion-input
      [placeholder]="placeholder()"
      [value]="control()?.value ?? ''"
      (ionInput)="control()?.setValue($event.detail.value ?? '')"
      (ionBlur)="control()?.markAsTouched()">
    </ion-input>
  }
  @if (type() === 'date') {
    <ion-datetime-button [datetime]="datetimeId()">
    </ion-datetime-button>

    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime
          [id]="datetimeId()"
          presentation="date"
          [value]="control()?.value"
          (ionChange)="control()?.setValue($event.detail.value)">
        </ion-datetime>
      </ng-template>
    </ion-modal>
  }
</div>
